<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>✨ ASMR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== えらぶ画面 ===== -->
  <div id="select-screen" class="screen active">
    <header class="header">
      <h1>✨ ASMR</h1>
      <p class="sub">すきなASMRをえらんで、きもちいい音をたのしもう♪</p>
    </header>

    <div class="category-section">
      <h2 class="category-title">🧈 バタースクイーズ</h2>
      <div class="cards">
        <button class="card" data-butter="normal">
          <span class="card-emoji">🧈</span>
          <div class="card-name">ふつうのバター</div>
          <p class="card-desc">きほんのバター！</p>
        </button>

        <button class="card" data-butter="choco">
          <span class="card-emoji">🍫</span>
          <div class="card-name">チョコバター</div>
          <p class="card-desc">あまーいチョコのかおり♪</p>
        </button>

        <button class="card" data-butter="ichigo">
          <span class="card-emoji">🍓</span>
          <div class="card-name">いちごバター</div>
          <p class="card-desc">ピンクでかわいい♡</p>
        </button>

        <button class="card" data-butter="matcha">
          <span class="card-emoji">🍵</span>
          <div class="card-name">まっちゃバター</div>
          <p class="card-desc">おちゃのいいかおり〜</p>
        </button>
      </div>
    </div>

    <div class="category-section">
      <h2 class="category-title">🥟 肉まんスクイーズ</h2>
      <div class="cards">
        <button class="card" data-butter="nikuman_normal">
          <span class="card-emoji">🥟</span>
          <div class="card-name">ふつうの肉まん</div>
          <p class="card-desc">ほかほか＆まっ白もちもち！</p>
        </button>

        <button class="card" data-butter="nikuman_ichigo">
          <span class="card-emoji">🍓🥟</span>
          <div class="card-name">いちご肉まん</div>
          <p class="card-desc">ピンクのあまい肉まん♡</p>
        </button>

        <button class="card" data-butter="nikuman_choco">
          <span class="card-emoji">🍫🥟</span>
          <div class="card-name">チョコ肉まん</div>
          <p class="card-desc">とろけるチョコまん♪</p>
        </button>

        <button class="card" data-butter="nikuman_matcha">
          <span class="card-emoji">🍵🥟</span>
          <div class="card-name">まっちゃ肉まん</div>
          <p class="card-desc">ほろにがお茶の肉まん〜</p>
        </button>
      </div>
    </div>

    <div class="category-section">
      <h2 class="category-title">⌨️ キーボードASMR</h2>
      <div class="cards">
        <button class="card" data-butter="kb_creamy">
          <span class="card-emoji">🍦</span>
          <div class="card-name">クリーミー</div>
          <p class="card-desc">コトコト♪ 深い打鍵音</p>
        </button>

        <button class="card" data-butter="kb_clacky">
          <span class="card-emoji">⚡</span>
          <div class="card-name">クラッキー</div>
          <p class="card-desc">カチカチッ！ 爽快な音</p>
        </button>

        <button class="card" data-butter="kb_jelly">
          <span class="card-emoji">🍮</span>
          <div class="card-name">ゼリー</div>
          <p class="card-desc">ぽこぽこ♡ グミみたい</p>
        </button>

        <button class="card" data-butter="kb_glass">
          <span class="card-emoji">💎</span>
          <div class="card-name">ガラス</div>
          <p class="card-desc">カラン♪ 澄んだ透明音</p>
        </button>
      </div>
    </div>

    <div class="category-section">
      <h2 class="category-title">🍓 フルーツ飴ASMR</h2>
      <div class="cards">
        <button class="card" data-butter="tanghulu_ichigo">
          <span class="card-emoji">🍓✨</span>
          <div class="card-name">いちご飴</div>
          <p class="card-desc">パリンッ！ カリッとあまい</p>
        </button>

        <button class="card" data-butter="tanghulu_muscat">
          <span class="card-emoji">🍇✨</span>
          <div class="card-name">マスカット飴</div>
          <p class="card-desc">シャインマスカットの飴♪</p>
        </button>

        <button class="card" data-butter="tanghulu_mikan">
          <span class="card-emoji">🍊✨</span>
          <div class="card-name">みかん飴</div>
          <p class="card-desc">ジューシー＆パリパリ！</p>
        </button>

        <button class="card" data-butter="tanghulu_apple">
          <span class="card-emoji">🍎✨</span>
          <div class="card-name">りんご飴</div>
          <p class="card-desc">おまつりの大人気あめ♡</p>
        </button>
      </div>
    </div>

    <div class="category-section">
      <h2 class="category-title">🫧 プッシュポップASMR</h2>
      <div class="cards">
        <button class="card" data-butter="pushpop_rainbow">
          <span class="card-emoji">💖🌈</span>
          <div class="card-name">レインボーハート</div>
          <p class="card-desc">にじいろハートをポコポコ♪</p>
        </button>

        <button class="card" data-butter="pushpop_star">
          <span class="card-emoji">⭐✨</span>
          <div class="card-name">パステルスター</div>
          <p class="card-desc">ゆめかわ星のバブル☆</p>
        </button>

        <button class="card" data-butter="pushpop_bear">
          <span class="card-emoji">🐻🎈</span>
          <div class="card-name">くまちゃん</div>
          <p class="card-desc">かわいいクマをぽちぽち♡</p>
        </button>

        <button class="card" data-butter="pushpop_candy">
          <span class="card-emoji">🍭🍬</span>
          <div class="card-name">キャンディ</div>
          <p class="card-desc">ポップなキャンディバブル！</p>
        </button>
      </div>
    </div>

    <div class="category-section">
      <h2 class="category-title">🧪 スライムASMR</h2>
      <div class="cards">
        <button class="card" data-butter="slime_sarasara">
          <span class="card-emoji">💧✨</span>
          <div class="card-name">サラサラ系</div>
          <p class="card-desc">ちゃぷちゃぷ♪ 水スライム</p>
        </button>

        <button class="card" data-butter="slime_awaawa">
          <span class="card-emoji">🫧☁️</span>
          <div class="card-name">アワアワ系</div>
          <p class="card-desc">シュワシュワ♪ 泡スライム</p>
        </button>

        <button class="card" data-butter="slime_butsubutsu">
          <span class="card-emoji">🟣🧋</span>
          <div class="card-name">ぶつぶつ系</div>
          <p class="card-desc">ぐちょぐちょっ！ つぶスライム</p>
        </button>

        <button class="card" data-butter="slime_karikari">
          <span class="card-emoji">💎❄️</span>
          <div class="card-name">カリカリ系</div>
          <p class="card-desc">パキパキッ！ 氷スライム</p>
        </button>
      </div>
    </div>

    <a href="../" class="home-link">🏠 あそびばにもどる</a>
  </div>

  <!-- ===== パキパキ画面 ===== -->
  <div id="play-screen" class="screen">
    <header class="play-header">
      <button id="btn-back" class="btn-icon" aria-label="もどる">← もどる</button>
      <div id="butter-label" class="butter-label">🧈 ふつうのバター</div>
    </header>

    <div id="butter-area" class="butter-area">
      <!-- むにゅむにゅモード切り替えバナー -->
      <div id="squish-banner" class="squish-banner hidden">✨ むにゅむにゅタイム！ ✨</div>

      <!-- スクイーズ変形するバターコンテナ -->
      <div id="butter-stage" class="butter-stage">
        <svg id="butter-svg" viewBox="0 0 320 220" class="butter-svg">
          <defs>
            <!-- もちもちバター本体のグラデーション -->
            <radialGradient id="squish-body-grad" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="var(--butter-light)" />
              <stop offset="65%" stop-color="var(--butter-main)" />
              <stop offset="100%" stop-color="var(--butter-dark)" />
            </radialGradient>

            <!-- 外側ワックスシェルのグラデーション -->
            <linearGradient id="wax-top-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
              <stop offset="35%" stop-color="var(--butter-light)" />
              <stop offset="85%" stop-color="var(--butter-main)" />
              <stop offset="100%" stop-color="rgba(255, 255, 255, 0.85)" />
            </linearGradient>

            <!-- ツヤツヤハイライト -->
            <linearGradient id="gloss" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
              <stop offset="45%" stop-color="rgba(255,255,255,0.2)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>

            <filter id="squish-shadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="rgba(120, 70, 30, 0.28)" />
            </filter>
          </defs>

          <!-- 影 -->
          <ellipse cx="160" cy="188" rx="120" ry="18" fill="rgba(100, 60, 20, 0.18)" id="butter-drop-shadow" />

          <!-- 肉まんの敷き紙（肉まん選択時に表示） -->
          <rect id="nikuman-paper" class="nikuman-paper hidden"
            x="70" y="174" width="180" height="10" rx="3"
            fill="#e8dcc4" stroke="#d5c4a6" stroke-width="1.5" stroke-dasharray="6,4" />

          <!-- 【層1: もちもち本体（内側）】 -->
          <g id="butter-core" filter="url(#squish-shadow)">
            <!-- メインボディ（バターまたは肉まんの形） -->
            <path id="core-body" class="core-body"
              d="M 60,75 C 60,50 90,42 160,42 C 230,42 260,50 260,75 C 260,95 264,135 258,162 C 254,178 220,182 160,182 C 100,182 66,178 62,162 C 56,135 60,95 60,75 Z"
              fill="url(#squish-body-grad)" />

            <!-- もちもちの上部ハイライト -->
            <ellipse cx="140" cy="65" rx="75" ry="16" fill="rgba(255, 255, 255, 0.45)" class="core-shine" />
            <ellipse cx="120" cy="62" rx="35" ry="7" fill="rgba(255, 255, 255, 0.7)" class="core-shine-bright" />

            <!-- 肉まんのてっぺんのひだ（結び目）パーツ -->
            <g id="nikuman-pleats" class="nikuman-pleats hidden">
              <!-- ひだのしわ -->
              <path d="M 160,42 Q 150,56 135,70" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path d="M 160,42 Q 162,58 160,72" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path d="M 160,42 Q 170,56 185,70" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path d="M 160,42 Q 140,50 115,58" stroke="rgba(0,0,0,0.12)" stroke-width="2.5" stroke-linecap="round" fill="none" />
              <path d="M 160,42 Q 180,50 205,58" stroke="rgba(0,0,0,0.12)" stroke-width="2.5" stroke-linecap="round" fill="none" />
              <!-- てっぺんのきゅっとした絞り -->
              <ellipse cx="160" cy="42" rx="10" ry="6" fill="var(--butter-dark)" opacity="0.6" />
              <ellipse cx="160" cy="40" rx="6" ry="3.5" fill="var(--butter-main)" />
            </g>

            <!-- 肉まんのかわいいお顔パーツ -->
            <g id="nikuman-face" class="nikuman-face hidden">
              <!-- 【通常時の笑顔 (^ ‿ ^)】 -->
              <g id="face-normal">
                <!-- 左目 -->
                <circle cx="130" cy="112" r="5" fill="#3a2a1a" />
                <circle cx="128.5" cy="110" r="1.8" fill="#ffffff" />
                <!-- 右目 -->
                <circle cx="190" cy="112" r="5" fill="#3a2a1a" />
                <circle cx="188.5" cy="110" r="1.8" fill="#ffffff" />
                <!-- お口（にっこり） -->
                <path d="M 153,122 Q 160,128 167,122" stroke="#4a3525" stroke-width="2.6" stroke-linecap="round" fill="none" />
                <!-- ほっぺ（ピンクチーク） -->
                <ellipse cx="118" cy="120" rx="8" ry="5" fill="#ff7e9e" opacity="0.55" />
                <ellipse cx="202" cy="120" rx="8" ry="5" fill="#ff7e9e" opacity="0.55" />
              </g>

              <!-- 【スクイーズ中のむぎゅ〜顔 (> ｏ <)】 -->
              <g id="face-squish" class="hidden">
                <!-- ぎゅっと閉じた左目 ( > ) -->
                <path d="M 124,110 L 133,114 L 124,118" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                <!-- ぎゅっと閉じた右目 ( < ) -->
                <path d="M 196,110 L 187,114 L 196,118" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                <!-- むぎゅっと開いたお口 ( ｏ ) -->
                <ellipse cx="160" cy="124" rx="5" ry="6.5" fill="#6a3525" />
                <ellipse cx="160" cy="126" rx="3" ry="3.5" fill="#ff7e9e" />
                <!-- ぽわっと濃くなるチーク -->
                <ellipse cx="118" cy="121" rx="9" ry="6" fill="#ff5a82" opacity="0.7" />
                <ellipse cx="202" cy="121" rx="9" ry="6" fill="#ff5a82" opacity="0.7" />
              </g>
            </g>
          </g>

          <!-- 【層2: 外側の薄いワックス膜（パキパキ割れて剥がれる殻）】 -->
          <g id="wax-shell" class="wax-shell">
            <!-- ワックス表面 -->
            <path id="wax-cover" class="wax-cover"
              d="M 60,75 C 60,50 90,42 160,42 C 230,42 260,50 260,75 C 260,95 264,135 258,162 C 254,178 220,182 160,182 C 100,182 66,178 62,162 C 56,135 60,95 60,75 Z"
              fill="url(#wax-top-grad)" opacity="0.95" />

            <!-- ワックスの硬質ツヤとエッジ反射 -->
            <path id="wax-gloss" class="wax-gloss"
              d="M 65,72 C 65,52 92,45 160,45 C 228,45 255,52 255,72 C 255,88 230,95 160,95 C 90,95 65,88 65,72 Z"
              fill="url(#gloss)" opacity="0.8" />
            <path id="wax-rim" class="wax-rim"
              d="M 68,60 C 95,48 135,46 160,46 C 200,46 240,50 252,62"
              fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round" />
          </g>

          <!-- 【層3: ヒビ・穴あきレイヤー】 -->
          <g id="crack-layer"></g>
        </svg>
      </div>

      <p class="hint" id="hint-text">おしてパキパキわろう！</p>
    </div>

    <!-- キーボードエリア（キーボード選択時に表示） -->
    <div id="keyboard-area" class="keyboard-area hidden">
      <div class="keyboard-case">
        <div class="keyboard-grid" id="keyboard-grid">
          <!-- 12個のキーキャップ（3行×4列） -->
          <button class="key-cap" data-key="0"><span class="key-top">♥</span></button>
          <button class="key-cap" data-key="1"><span class="key-top">★</span></button>
          <button class="key-cap" data-key="2"><span class="key-top">♪</span></button>
          <button class="key-cap" data-key="3"><span class="key-top">☁</span></button>
          <button class="key-cap" data-key="4"><span class="key-top">Q</span></button>
          <button class="key-cap" data-key="5"><span class="key-top">W</span></button>
          <button class="key-cap" data-key="6"><span class="key-top">E</span></button>
          <button class="key-cap" data-key="7"><span class="key-top">R</span></button>
          <button class="key-cap" data-key="8"><span class="key-top">A</span></button>
          <button class="key-cap" data-key="9"><span class="key-top">S</span></button>
          <button class="key-cap" data-key="10"><span class="key-top">D</span></button>
          <button class="key-cap" data-key="11"><span class="key-top">F</span></button>
        </div>
      </div>
      <p class="hint" id="keyboard-hint">すきなだけカタカタたたいてね♪</p>
    </div>

    <!-- フルーツ飴エリア（フルーツ飴選択時に表示） -->
    <div id="tanghulu-area" class="tanghulu-area hidden">
      <div id="tanghulu-banner" class="squish-banner hidden">✨ たべごろ！カリカリフルーツ飴 ✨</div>
      <div class="tanghulu-stage" id="tanghulu-stage">
        <!-- フルーツ串本体 -->
        <div class="tanghulu-skewer">
          <div class="skewer-stick"></div>
          <div class="tanghulu-items" id="tanghulu-items"></div>
        </div>
      </div>
      <p class="hint" id="tanghulu-hint">タップして飴をパリンッと割ろう！</p>
    </div>

    <!-- プッシュポップエリア（プッシュポップ選択時に表示） -->
    <div id="pushpop-area" class="pushpop-area hidden">
      <div id="pushpop-banner" class="squish-banner hidden">✨ ぜんぶ押せた！くるっとうらがえし！ ✨</div>
      <div class="pushpop-wrapper" id="pushpop-wrapper">
        <div class="pushpop-plate" id="pushpop-plate">
          <div class="pushpop-grid" id="pushpop-grid"></div>
        </div>
      </div>
      <p class="hint" id="pushpop-hint">指でなぞってポコポコ押しこもう♪</p>
    </div>

    <!-- スライムエリア（スライム選択時に表示） -->
    <div id="slime-area" class="slime-area hidden">
      <div id="slime-banner" class="squish-banner hidden">✨ ぷるぷるスライムタイム！ ✨</div>
      <div class="slime-stage" id="slime-stage">
        <!-- スライム本体コンテナ -->
        <div class="slime-blob" id="slime-blob">
          <svg id="slime-svg" viewBox="0 0 320 260" class="slime-svg">
            <defs>
              <radialGradient id="slime-base-grad" cx="40%" cy="30%" r="70%">
                <stop offset="0%" stop-color="var(--slime-light, #a0e8ff)" />
                <stop offset="60%" stop-color="var(--slime-main, #38b6ff)" />
                <stop offset="100%" stop-color="var(--slime-dark, #0080ff)" />
              </radialGradient>
              <linearGradient id="slime-highlight" x1="0" y1="0" x2="0.3" y2="1">
                <stop offset="0%" stop-color="rgba(255,255,255,0.75)" />
                <stop offset="50%" stop-color="rgba(255,255,255,0.15)" />
                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
              </linearGradient>
              <filter id="slime-shadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="rgba(0, 80, 160, 0.28)" />
              </filter>
            </defs>
            <!-- 影 -->
            <ellipse cx="160" cy="225" rx="125" ry="20" fill="rgba(0, 40, 80, 0.18)" id="slime-drop-shadow" />
            <!-- スライム本体 -->
            <path id="slime-body-path" class="slime-body-path" filter="url(#slime-shadow)"
              d="M 60,140 C 50,85 100,50 160,50 C 220,50 270,85 260,140 C 255,190 225,220 160,220 C 95,220 65,190 60,140 Z"
              fill="url(#slime-base-grad)" />
            <!-- 光沢ハイライト -->
            <path id="slime-shine" class="slime-shine"
              d="M 90,95 C 105,70 140,62 175,64 C 205,66 225,75 220,88 C 215,100 195,95 165,92 C 130,89 105,98 90,95 Z"
              fill="url(#slime-highlight)" />
            <!-- 内部のテクスチャ（泡、ビーズ、結晶など）グループ -->
            <g id="slime-particles-group" class="slime-particles-group"></g>
            <!-- ポーク痕（くぼみ・穴）グループ -->
            <g id="slime-pokes-group" class="slime-pokes-group"></g>
          </svg>
        </div>
      </div>
      <p class="hint" id="slime-hint">指でつついて、のばして、こねてみよう♪</p>
    </div>

    <!-- アクションボタン（いつでも利用可能） -->
    <div id="complete-buttons" class="complete-buttons">
      <button id="btn-retry" class="btn-action">🔄 もういっかい</button>
      <button id="btn-change" class="btn-action btn-secondary">✨ べつのASMR</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
