<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>✨ あそびば ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'M PLUS Rounded 1c', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd9ec 0%, #d9ecff 50%, #e8d9ff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 760px; text-align: center; }
  h1 {
    font-size: clamp(28px, 6vw, 48px); font-weight: 900; color: #ff5fa2;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255,95,162,.25);
    margin-bottom: 8px;
  }
  .sub { color: #7a6a8a; font-weight: 700; margin-bottom: 32px; }
  .cards { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card {
    display: block; text-decoration: none; background: rgba(255,255,255,.85);
    border: 4px solid #fff; border-radius: 28px; padding: 28px 20px;
    box-shadow: 0 8px 24px rgba(180,140,200,.28);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px) rotate(-1deg);
    box-shadow: 0 14px 32px rgba(180,140,200,.4);
  }
  .emoji { font-size: 56px; display: block; margin-bottom: 12px; }
  .name { font-size: 22px; font-weight: 900; color: #ff5fa2; margin-bottom: 6px; }
  .card:nth-child(2) .name { color: #5fa2ff; }
  .desc { font-size: 14px; font-weight: 700; color: #7a6a8a; line-height: 1.6; }
  footer { margin-top: 36px; font-size: 12px; font-weight: 700; color: #9a8aaa; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>✨ あそびば ✨</h1>
    <p class="sub">すきなものをえらんであそんでね♡</p>
    <div class="cards">
      <a class="card" href="./gacha/">
        <span class="emoji">🍣</span>
        <div class="name">ガチャ</div>
        <p class="desc">すし・パン・まほう・うみ・アイドル…<br>15しゅるいのガチャがまわせるよ！</p>
      </a>
      <a class="card" href="./dress-up/">
        <span class="emoji">👗</span>
        <div class="name">ゆめかわ♡きせかえ</div>
        <p class="desc">きせかえ・ともだち広場・双子公園<br>まほうの世界へワープ！</p>
      </a>
    </div>
    <footer>GitHub Pages でこうかいちゅう</footer>
  </div>
</body>
</html>
